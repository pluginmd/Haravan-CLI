version: 2

project_name: haravan-cli

before:
  hooks:
    - go mod tidy

builds:
  - id: haravan-cli
    main: .
    binary: haravan-cli
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X github.com/pluginmd/haravan-cli/internal/build.Version={{.Version}}
      - -X github.com/pluginmd/haravan-cli/internal/build.Commit={{.Commit}}
      - -X github.com/pluginmd/haravan-cli/internal/build.Date={{.Date}}

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - README.md

checksum:
  name_template: "checksums.txt"

snapshot:
  version_template: "{{ incpatch .Version }}-dev"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^chore:"
      - "^test:"
      - "Merge pull request"
